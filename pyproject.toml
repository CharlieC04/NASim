[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasim"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
viz = [
    "matplotlib>=3.8"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nasim"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src"]