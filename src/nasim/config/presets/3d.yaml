name: harvard_3d_layered
description: >
  Phase-1 layered 3D device: same per-zone hardware parameters as
  harvard_2d, with a stacked (qLDPC memory / surface compute / magic
  factory) layout along z instead of sharing one plane. Movement and
  layer-spacing parameters (v_z_um_per_us, axial_clearance_um) follow
  the Piqasso/Cubism 3D neutral-atom hardware model (Table II).
dimensions: 3D

geometry:
  layers: 3
  layer_spacing_um: 21.0
  axial_clearance_um: 20.0
  sites:
    grid: null
  gate_pair_dist_um: 2.5

interaction:
  blockade_radius_um: 5.0

transport:
  v_xy_um_per_us: 0.55
  v_z_um_per_us: 0.40
  v_loss_um_per_us: 1.0
  handover_time_us: 15.0
  handover_fidelity: 0.999
  move_profile: min_jerk

addressing:
  trap_beam_waist_um: [0.8,1.2]
  local_1q_beam_waist_um: [1.0,1.5]
  global_drive_beam_waist_um: ">=100"

readout:
  fidelity: 0.998
  time_us: 500.0

gates:
  cz_fidelity: 0.995
  cz_duration_us: 0.36
  single_qubit_fidelity: 0.9975
  single_qubit_duration_us: 0.625
  carrier_fidelity: 0.9997

coherence:
  t2_s: 12.6

cultivation:
  check_success_prob: 0.25
  check_cycles: 12.5
  num_subfactories: 1
  escape_success_prob: 0.66
  escape_cycles_by_distance:
    7: 0.5
    9: 0.5
    13: 6.0
    15: 6.0
  teleportation_success_prob: 0.5
  t_state_infidelity_target: 1.0e-8